# @package _global_
# SONIC X2 Ultra — multi-skill fine-tune (dance + shadow-boxing + slow-walk, 182 clips).
#
# Inherits the arm-dynamics fine-tune (wrist_roll PALM tracking + arm-scoped
# velocity reward) and concentrates (finetune_sample_rate 0.3) on a 182-clip
# target set: 125 dance/faint/crawl/kneel + 23 shadow-boxing + 34 slow-walk
# captures. Mixed native fps (120 dance / 50 executed) is fine -- motion-lib
# resamples each clip to the 50 Hz control rate at load.
#
# PAIRED WITH the manufacturer-datasheet effort/velocity limits in x2_ultra.py
# (x2_joint_details sheet, 2026-07-15): waist p/r effort 36->24, wrist p/r effort
# 6.0->4.8 + velocity 20.944->4.188 rad/s (the wrist is a slow Harmonic joint, so
# the earlier "un-cap to 200 rpm" was REVERTED -- deploy wrist-twist is now a
# reference-feasibility issue, see project_x2_motor_datasheet_effort_fix).
#
# Warm start (launcher +checkpoint=): the 175030 4k checkpoint (model_step_004000.pt)
# -- obs/action dims unchanged, loads cleanly; policy re-adapts to the lower waist
# authority + slower wrist over a few hundred iters.

defaults:
  - /exp/manager/universal_token/all_modes/sonic_x2_ultra_arm_dynamics_finetune
  - _self_

exp_var: dance_finetune_v1
project_name: TRL_X2Ultra_Dance

manager_env:
  commands:
    motion:
      motion_lib_cfg:
        fine_tune_dataset:
          # 182 target clips: 125 dance/faint_stand_up/crawl/kneel (@120fps, 39 _M
          # mirrors) + 23 shadow-boxing (13 orig + 10 _M mirror, @50fps) + 34
          # slow-walk / walk captures from g1_recorded_x2 (@50fps). Mixed native fps
          # is fine -- motion-lib resamples each clip to the 50 Hz control rate at load.
          motion_file: gear_sonic/data/motions/x2_all_finetune_v3.pkl
          override_corpus: true
          finetune_sample_rate: 0.3   # 30% on the 182 targets -- matches arm_dynamics (kept general feasibility ~93%); avoids the catastrophic-forgetting risk of higher concentration
