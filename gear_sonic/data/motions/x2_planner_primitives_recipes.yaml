# X2 heuristic-planner primitive recipes (v6 — static_upper_body family
# rebuilt as fully synthetic, with hard angle caps and hip/ankle counter-
# balance, after v5 fwd_step rebase on A034 forward-loop).
#
# Source of truth for the runtime ``x2_planner_primitives.pkl``. Built by
# ``gear_sonic/scripts/build_x2_planner_primitives.py``. Hand-edited.
#
# Re-run after editing:
#
#     .venv/bin/python -m gear_sonic.scripts.build_x2_planner_primitives
#
# v6 changes (2026-05-13, reach-ladder followup):
#   - lean_fwd_{small,medium,large}: replaced the v2 mocap source
#     (body_check_001__A474_M [752, 827]) + scale_magnitude derivatives
#     with PURE SYNTHESIS via synthesize_waist_ramp(axis=pitch). Each
#     magnitude now declares its own peak_deg explicitly (8 / 14 / 20)
#     instead of multiplying a single mocap apex by 0.5x / 1.0x / 1.4x.
#     The v2 1.4x derivative on lean_fwd_large pushed the apex outside
#     the source clip's distribution; SONIC under-tracked it. The synth
#     version uses hip_pitch_share=0.30 to reproduce the natural pelvis-
#     and-torso lean from the body_check mocap (so the new synth pose
#     is "deadlift hinge" shaped, not a wagging-top single-joint waist
#     bend) while staying parameterizable and capped.
#   - NEW lean_left_{small,medium,large} / lean_right_*: pure waist_roll
#     synthesis (peaks 4 / 7 / 10 deg). Right side derives via mirror_lr.
#     Foot-flat counter-roll on the ankles is OFF for now; a follow-up
#     can enable ankle_roll_share if SONIC has trouble keeping the feet
#     planted at 10 deg lateral lean.
#   - torso_left_45deg / torso_right_45deg RENAMED to torso_left_40deg /
#     torso_right_40deg with peak_deg=40 (was 45). The new yaw cap of 40
#     deg matches the SONIC-trackable envelope and applies uniformly to
#     all torso bins. Magnitude tokens deg_15 / deg_30 are unchanged;
#     the new torso ladder uses deg_40 as its top step (added to
#     LocomotionCommand.as_bin_name's magnitude_map).
#   - All torso_left_* recipes now pass hip_yaw_share=0.30 so the
#     synthesized twist co-actuates the hips in the same world rotation
#     direction as the waist. Visually a more natural reach pose; the
#     mirror_lr-derived torso_right_* counterparts follow automatically
#     because the share is applied with the LEFT=+share / RIGHT=-share
#     anti-symmetric pattern documented in op_synthesize_waist_ramp.
#   - Hard caps INSIDE op_synthesize_waist_ramp REJECT |peak_deg| above
#     pitch=20 / roll=10 / yaw=40 -- a recipe asking for an unstable
#     angle now fails at build time instead of producing a visually
#     fine reference that tips the robot in deploy.
#
# v5 changes (2026-05-13, gallery-validation followup):
#   - fwd_step_1ft: replaced the v4 source
#     (walk_randdir_relax_001__A005 [0, 68]) which only produced
#     +20 cm of body-frame forward translation over 2.28 s (~9 cm/s avg)
#     -- after scale_magnitude 0.5 / 0.25 the half_ft / quarter_ft
#     derivatives became +10 / +5 cm and were below the policy noise
#     floor, so the robot did not visibly step forward in the
#     gallery_fwd_back_shuffle demo (only the back_step bins moved).
#     v5 source: walk_forward_loop_003__A034 frames [279, 327] (1.6 s
#     at 30 fps, body-frame dx=+0.45 m, lat=+0.01 m, dyaw +0.3 deg).
#     Both endpoints are in symmetric square-ish stance (knee
#     asymmetry 0.0 / 0.1 deg), so the seam-blend into idle does not
#     erase the stride. This is the same source that powers the
#     proven-tracking fwd_walk_standard. After scaling, half_ft and
#     quarter_ft become ~22 cm and ~11 cm, both clearly above noise.
#     The previous v3 attempt at this same clip used window [229, 277]
#     which had a 14.8 deg knee asymmetry at one endpoint; window
#     [279, 327] sits between strides on BOTH sides.
#   - Other primitives unchanged from v4.
#
# v4 changes (2026-05-12, locomotion-rebuild followup):
#   - fwd_step_1ft: replaced one-stride-of-continuous-walk window with a
#     true SQUARE -> step -> square -> step -> SQUARE clip. The v3 source
#     (walk_forward_loop_003__A034 [229, 277]) was a one-stride excerpt
#     of a continuous walk, so its endpoints were mid-stride staggered
#     poses. After the runtime blended 16 frames at the seams the actual
#     foot motion was reduced to a "shake without stepping" under SONIC.
#     v4 source: walk_randdir_relax_001__A005 [0, 68] -- begins from a
#     >0.6s feet-side-by-side rest, lifts L 5.7 cm peak, settles into a
#     1.0s square stance, lifts R 10.1 cm peak, settles back to square.
#     Net dx=+0.20 m, dy=+0.027 m, dyaw +1.6 deg, yaw_osc 19.7 deg
#     (well within SONIC tolerance). SONIC sweep: 2.9 cm of stable
#     forward motion with +2 deg yaw drift over 7.4 s -- the under-
#     tracking is intentional, the user prefers slow-and-stable for
#     locomanipulation. Matches the user's ask: "two steps max, one
#     leg moves, the other catches up."
#   - Other primitives unchanged from v3.
#
# v3 changes (2026-05-11, after first SONIC sweep on v2):
#   - The v2 walk sources had 60-80 deg pelvis-yaw oscillation (raw
#     SMPL->X2 retargeting captures the whole walk-cycle pelvis swing).
#     The SONIC sweep showed the policy interprets that swing as
#     stand-in-place wobble: fwd_walk_standard moved only 0.097 m
#     forward over 8.6s vs commanded 4 m. v3 picks clips with pelvis-yaw
#     oscillation <= 55 deg per 1-second window (after de-trend), which
#     matches the 17-31 deg the v1 pickups had.
#   - v3 sources:
#     * fwd: walk_forward_loop_003__A034   (yaw_osc 53, fwd 0.51 m/s)
#     * back: walk_backward_loop_005__A028_M (yaw_osc 39, back 0.34 m/s)
#     * side: walk_sideway_090_stop_001__A039_M (yaw_osc 39, side 0.21 m/s)
#
# v2 changes (2026-05-11):
#   - Replaced the v1 walk sources, which the SONIC sweep showed had:
#     * back source `Loop_Backward_Walk_001__A019`: feet lift 13 cm but
#       net XY speed ~0.007 m/s -> robot just shook its waist in place.
#     * forward step source `walk_180_R_003__A333_M`: 16 cm foot lift AND
#       a 180 deg arc (yaw drift baked in).
#     * side source `lateral_speed_step_ff_270_R_002__A359_M`: 52 cm
#       foot lift (high-knee march), unusable.
#
#   - Replaced the synthesized `lean_fwd_*` family (waist_pitch ramp) with
#     natural `body_check_001__A474_M` mocap windows. The mocap pelvis
#     pitches over alongside the waist (real CG-shift), where the synth
#     primitive only moved the waist joint and left the pelvis upright,
#     creating an unstable "wagging top" that drifted forward under SONIC.
#
#   - Added `crouch_*` family using the only feet-planted, low-yaw squat
#     clips the seed PKL contains (the `medium_big_light_one_hand_*` series
#     where the actor reached low while standing in place).
#
# Layering (unchanged):
#   - Static synth bins (torso left/right yaw): waist_yaw ramp from
#     DEFAULT_STAND_POSE. Kept because the corpus had no good
#     waist-twist-only clips.
#
#   - Locomotion BASES (forward / back / side / 4 left turns): clip_window
#     into the curated source clip + freeze arms+head to neutral so the
#     planner doesn't fight the VLA's arm output.
#
#   - DERIVED bins:
#       * Magnitude variants (half / quarter step) -> scale_magnitude.
#       * Right-side variants of left turns / leans -> mirror_lr.
#       * Backward steps do NOT mirror from forward (heel-strike vs
#         toe-off polarity differs); they keep their own curated base.

primitives:

  # =====================================================================
  # IDLE -- always-on rest loop. Mocap idle has unnatural wrist/shoulder
  # values (~1.3 rad), so we freeze arms+head to canonical stand so the
  # handover into every other frozen-arm bin (which is all of them) has a
  # small, constant seam delta instead of a huge wrist snap.
  # =====================================================================

  - bin_name: idle_stand
    family: idle
    notes: "curator pick: best feet-planted slice; arms+head pinned to neutral stand"
    ops:
      - clip_window:
          motion_key: loco__idle_vigilance_start_R_001__A502
          start_frame: 33
          n_frames: 45
      - freeze:
          groups: [arms, head]

  # =====================================================================
  # CONTINUOUS WALK
  # =====================================================================

  - bin_name: fwd_walk_standard
    family: continuous_walk
    notes: |
      v3 source: walk_forward_loop_003__A034. Whole-clip 11.17s,
      0.51 m/s straight, fl_max 14.6 cm, dyaw -0.1 deg, yaw_osc 53 deg
      (acceptable, <55 SONIC-trackable bound). Window [82, 262] = 6 s,
      dx=+4.09 m, dyaw -0.3 deg, fl_max 14.6 cm, planted endpoints.
    ops:
      - clip_window:
          motion_key: loco__walk_forward_loop_003__A034
          start_frame: 82
          n_frames: 180
      - freeze:
          groups: [arms, head]

  - bin_name: back_walk_standard
    family: continuous_walk
    notes: |
      v3 source: walk_backward_loop_005__A028_M. Whole-clip 19.87s,
      -0.34 m/s straight, fl_max 12.7 cm, dyaw -1.5 deg, yaw_osc 39 deg.
      Window [299, 479] = 6 s, dx=-1.89 m, dy=+0.06 m, dyaw -0.1 deg,
      fl_max 10.3 cm.
    ops:
      - clip_window:
          motion_key: loco__walk_backward_loop_005__A028_M
          start_frame: 299
          n_frames: 180
      - freeze:
          groups: [arms, head]

  # =====================================================================
  # LOCOMOTION -- forward shuffle (1ft base, halves derived).
  #
  # v5 base: a one-stride window from the same A034 forward-loop that
  # powers fwd_walk_standard. Picked between strides on BOTH sides
  # (knee asymmetry 0.0 / 0.1 deg at endpoints) so the seam-blend into
  # idle does not erase the stride. The v4 randdir-relax base produced
  # only +20 cm of body-frame translation in 2.3 s (~9 cm/s avg); after
  # halving / quartering it dropped below the policy noise floor and
  # the robot did not visibly step in the gallery demo. v5 lifts the
  # base displacement to +45 cm over 1.6 s (~28 cm/s), comparable to
  # the back_step base (51 cm in 1.6 s).
  #
  # Halves derived via scale_magnitude on root XY (not joint deltas) so
  # the foot lift envelope stays physically consistent.
  # =====================================================================

  - bin_name: fwd_step_1ft
    family: locomotion
    notes: |
      v5 source: walk_forward_loop_003__A034 frames [279, 327] (1.6s
      at 30fps, body-frame dx=+0.45m, lat=+0.01m, dyaw +0.3 deg).
      Both endpoints in symmetric stance (knee asym start/end =
      0.0/0.1 deg), so seam-blend into idle preserves the stride.
      Same source clip as the proven-tracking fwd_walk_standard.

      Replaces v4 source (walk_randdir_relax_001__A005 [0, 68]) which
      only produced +20 cm of body-frame translation in 2.3 s (~9 cm/s);
      after scale_magnitude 0.5 / 0.25 the half_ft / quarter_ft
      derivatives became ~10 / ~5 cm and the policy treated them as
      noise. v5 base ~45 cm gives half_ft ~22 cm and quarter_ft ~11 cm,
      both clearly above the policy noise floor.
    ops:
      - clip_window:
          motion_key: loco__walk_forward_loop_003__A034
          start_frame: 279
          n_frames: 48
      - freeze:
          groups: [arms, head]

  - bin_name: fwd_step_half_ft
    family: locomotion
    notes: "derived: 0.5 * fwd_step_1ft"
    derive_from: fwd_step_1ft
    ops:
      - scale_magnitude:
          factor: 0.5

  - bin_name: fwd_step_quarter_ft
    family: locomotion
    notes: "derived: 0.25 * fwd_step_1ft"
    derive_from: fwd_step_1ft
    ops:
      - scale_magnitude:
          factor: 0.25

  # =====================================================================
  # LOCOMOTION -- backward shuffle (own base; cannot mirror from forward
  # because heel-strike / hip-flexion polarity is gait-specific).
  # =====================================================================

  - bin_name: back_step_half_ft
    family: locomotion
    notes: |
      v3 source: walk_backward_loop_005__A028_M frames [292, 340] (1.6s,
      dx=-0.52m, dy=+0.017m clean, dyaw -0.3 deg, fl_max=8.5cm).
      Lower yaw_osc than v2 source.
    ops:
      - clip_window:
          motion_key: loco__walk_backward_loop_005__A028_M
          start_frame: 292
          n_frames: 48
      - freeze:
          groups: [arms, head]

  - bin_name: back_step_quarter_ft
    family: locomotion
    notes: "derived: 0.5 * back_step_half_ft"
    derive_from: back_step_half_ft
    ops:
      - scale_magnitude:
          factor: 0.5

  # =====================================================================
  # LOCOMOTION -- side shuffle. MOCAP-based (clip_window from bones-seed).
  #
  # History: we initially tried synthesize_side_step_ramp (pure lateral
  # hip-roll, no hip_pitch, no waist_yaw) but the policy could not track
  # it under SONIC -- the synthesized motion lacked the implicit weight
  # transfer that real side-stepping uses, so the robot stood still or
  # fell over. We then reviewed all 99 walk_sideway_* / lateral_* /
  # strafing_* clips in the source library by stitching them into a
  # single SONIC playback (see scripts/stitch_side_walks_for_review.py +
  # record_sonic_review_video.py). Eyeballed clip 35/99
  # (walk_sideway_045_stop_001__A038_M) as the cleanest small step:
  # planted endpoints, low yaw drift, waist_yaw essentially fixed.
  #
  # Direction: clip_name says "045" = 45-degree sideway gait. The first
  # 3s window (frames 0..90 @ 30 Hz) projects to body-frame delta
  # dx=-0.25m (BACK), dy=-0.27m (RIGHT) -- a back-right diagonal of
  # ~37 cm at 45 deg. We accept the back-component for now (per user:
  # "keep it simple given how difficult it is to get any good moves").
  #
  # Bin layout: side_right_step is the mocap base; side_left_step is
  # the mirror. Single canonical magnitude per direction (no half_ft /
  # quarter_ft variants -- see comment block below the bin definitions).
  # =====================================================================

  # Single canonical side-step per direction (no half_ft / quarter_ft /
  # 1ft variants -- the policy could not reliably track scaled-down or
  # scaled-up versions of the A038_M mocap source, and stacking
  # variants with no real magnitude difference just bloats the planner
  # API. We keep ONE bin per direction; call it from any
  # (side_left|side_right) intent regardless of magnitude.

  - bin_name: side_right_step
    family: locomotion
    # User-approved bake: x2_review_walk_sideway_045_stop_A038_M_3s.pkl
    # (data/sim_to_real_anchors/browse_sonic/baked_pkls/). That file
    # was the SONIC playback the user blessed on 2026-05-11 -- it
    # consists of 1.5s leading stand-pad + 0.3s blend + this 3.0s
    # mocap window + 1.5s trailing stand-pad. The bin captures only
    # the inner 3s of motion; the planner state machine handles the
    # bracketing pads via runtime blends to/from idle_stand at clip
    # entry/exit.
    source_ref:
      mocap_key: loco__walk_sideway_045_stop_001__A038_M
      mocap_frames: [0, 90]                       # 3.0s @ 30Hz
      mocap_pkl: gear_sonic/data/motions/x2_ultra_bones_seed.pkl
      review_video: data/sim_to_real_anchors/browse_sonic/videos/x2_browser_side_walks_review.mp4
      review_clip_index: 35                       # of 99 in the review video
      review_video_timestamp: "02:34-02:38"       # the 3s window the user reviewed
      approved_bake_pkl: data/sim_to_real_anchors/browse_sonic/baked_pkls/x2_review_walk_sideway_045_stop_A038_M_3s.pkl
      approved_by_user_at: "2026-05-11"
    notes: |
      Mocap source: walk_sideway_045_stop_001__A038_M frames [0, 90]
      (3.0s @ 30Hz). Body-frame delta dx=-0.25m back, dy=-0.27m right
      -- a back-right diagonal slide at ~45deg, ~37 cm total. Yaw
      drift -15 deg over 3s, waist_yaw essentially fixed (span 0.9 deg),
      planted endpoints. Selected from the 99-clip side-walk SONIC
      review as clip 35/99 (eyeballed clean by user 2026-05-11).

      KNOWN LIMITATION: this 3s window is biomechanically a knees-
      locked pelvis-slide -- L knee span 3.8 deg, R knee span 0.1 deg
      over the window -- so visible foot lift under SONIC is minimal.
      The pelvis travels but the feet skate. We chose simplicity here
      ("just keep it simple for now given how difficult it is for us
      to get any good moves" -- user 2026-05-11) over a longer window
      with real stepping. If foot-lift becomes important later, see
      A038_M frames [60, 150] (L knee span 12.9 deg) or revisit the
      99-clip review video for a different source.
    ops:
      - clip_window:
          motion_key: loco__walk_sideway_045_stop_001__A038_M
          start_frame: 0
          n_frames: 90
      - freeze:
          groups: [arms, head]

  - bin_name: side_left_step
    family: locomotion
    notes: "derived: mirror_lr(side_right_step) -> back-left diagonal at ~45deg"
    derive_from: side_right_step
    ops:
      - mirror_lr: {}

  # =====================================================================
  # LOCOMOTION -- pivot turns LEFT (bases). All curator picks scored 0.6+
  # in v1 and the SONIC sweep showed they hit target heading within
  # ±1-3 deg, so they carry over unchanged.
  # =====================================================================

  - bin_name: turn_left_15deg
    family: locomotion
    notes: "curator pick (score 0.745)"
    ops:
      - clip_window:
          motion_key: loco__Step_Rotate_Reaction_Idle_0360_002__A019_M
          start_frame: 1350
          n_frames: 60
      - freeze:
          groups: [arms, head]

  - bin_name: turn_left_30deg
    family: locomotion
    notes: "curator pick (score 0.610)"
    ops:
      - clip_window:
          motion_key: loco__idle_turn_360_R_003__A265_M
          start_frame: 85
          n_frames: 70
      - freeze:
          groups: [arms, head]

  - bin_name: turn_left_45deg
    family: locomotion
    notes: "curator pick (score 0.685)"
    ops:
      - clip_window:
          motion_key: loco__Step_Rotate_Reaction_Idle_0135_001__A019
          start_frame: 1040
          n_frames: 105
      - freeze:
          groups: [arms, head]

  - bin_name: turn_left_90deg
    family: locomotion
    notes: "curator pick (score 0.734)"
    ops:
      - clip_window:
          motion_key: loco__idle_turn_270_R_003__A235_M
          start_frame: 0
          n_frames: 90
      - freeze:
          groups: [arms, head]

  # =====================================================================
  # LOCOMOTION -- pivot turns RIGHT (mirror of LEFT bases)
  # =====================================================================

  - bin_name: turn_right_15deg
    family: locomotion
    notes: "derived: mirror_lr(turn_left_15deg)"
    derive_from: turn_left_15deg
    ops:
      - mirror_lr: {}

  - bin_name: turn_right_30deg
    family: locomotion
    notes: "derived: mirror_lr(turn_left_30deg)"
    derive_from: turn_left_30deg
    ops:
      - mirror_lr: {}

  - bin_name: turn_right_45deg
    family: locomotion
    notes: "derived: mirror_lr(turn_left_45deg)"
    derive_from: turn_left_45deg
    ops:
      - mirror_lr: {}

  - bin_name: turn_right_90deg
    family: locomotion
    notes: "derived: mirror_lr(turn_left_90deg)"
    derive_from: turn_left_90deg
    ops:
      - mirror_lr: {}

  # =====================================================================
  # STATIC UPPER BODY -- forward leans (SYNTH, v6).
  #
  # v6: replaced the v2 mocap base (body_check_001__A474_M [752, 827])
  # + scale_magnitude derivatives with pure synthesis. Each magnitude
  # declares its own peak_deg explicitly (8 / 14 / 20) instead of
  # scaling a single mocap apex up/down -- the v2 1.4x derivative on
  # lean_fwd_large was outside the source clip's distribution and
  # SONIC under-tracked it.
  #
  # The synth uses hip_pitch_share=0.30 to reproduce the v2 mocap's
  # "real pelvis pitch + waist pitch" deadlift-hinge shape: at 20 deg
  # waist pitch the hips also flex by 6 deg, so the pelvis tips 6 deg
  # forward, total torso-in-world ~26 deg. CG at hip height shifts ~12
  # cm forward -- right at the foot half-length boundary, which is
  # exactly where the cap was set. ankle_pitch_share=0.0 because at
  # these angles the feet stay flat without explicit counter-rotation.
  #
  # Recipe ends back at idle (full trapezoid 0 -> peak -> 0), so the
  # runtime can blend in at any phase and the robot returns to stand
  # cleanly when the next idle command arrives.
  # =====================================================================

  - bin_name: lean_fwd_small
    family: static_upper_body
    notes: |
      synth: waist_pitch ramp 0->+8deg->0 with hip_pitch_share=0.30.
      Apex hip flex +2.4 deg, pelvis tilts ~2 deg forward, torso
      ~10 deg in world. Conservative reach extension with negligible
      CG shift -- safe for any payload.
    ops:
      - synthesize_waist_ramp:
          axis: pitch
          peak_deg: 8.0
          ramp_in_frames: 30
          hold_frames: 20
          ramp_out_frames: 30
          hip_pitch_share: 0.30
      - freeze:
          groups: [arms, head]

  - bin_name: lean_fwd_medium
    family: static_upper_body
    notes: |
      synth: waist_pitch ramp 0->+14deg->0 with hip_pitch_share=0.30.
      Apex hip flex +4.2 deg, pelvis tilts ~4 deg forward, torso
      ~18 deg in world. Comparable to the v2 mocap apex (21.6 deg
      total fwd pitch) but with explicit reproducible geometry.
    ops:
      - synthesize_waist_ramp:
          axis: pitch
          peak_deg: 14.0
          ramp_in_frames: 30
          hold_frames: 20
          ramp_out_frames: 30
          hip_pitch_share: 0.30
      - freeze:
          groups: [arms, head]

  - bin_name: lean_fwd_large
    family: static_upper_body
    notes: |
      synth: waist_pitch ramp 0->+20deg->0 (AT CAP) with
      hip_pitch_share=0.30. Apex hip flex +6 deg, pelvis tilts ~6 deg
      forward, torso ~26 deg in world. CG at hip height ~12 cm
      forward -- right at the foot half-length boundary. Anything
      beyond this needs a stepping recovery (use fwd_step_1ft +
      lean_fwd_medium chain instead).
    ops:
      - synthesize_waist_ramp:
          axis: pitch
          peak_deg: 20.0
          ramp_in_frames: 30
          hold_frames: 20
          ramp_out_frames: 30
          hip_pitch_share: 0.30
      - freeze:
          groups: [arms, head]

  # =====================================================================
  # STATIC UPPER BODY -- lateral leans (SYNTH, v6 NEW).
  #
  # New family for sideways reach without a step. Pure waist_roll
  # synthesis from stand pose; ankle_roll counter is OFF for now (the
  # cap of 10 deg is conservative enough that SONIC should keep the
  # feet planted via residual control).
  #
  # Foot half-WIDTH on the X2 is only ~5 cm, so the support polygon is
  # much tighter laterally than sagittally. The cap of 10 deg
  # corresponds to a ~10 cm CG shift at hip height -- already at the
  # edge of the support polygon for a payload-laden upper body. Do
  # NOT bump this without deploy evidence the policy can keep the
  # contralateral foot on the ground.
  #
  # Right side derives via mirror_lr, which negates waist_roll and
  # any anti-symmetric joint shares; the cap is enforced on the LEFT
  # recipe's |peak_deg|, so the mirrored counterpart inherits the same
  # bounded magnitude.
  # =====================================================================

  - bin_name: lean_left_small
    family: static_upper_body
    notes: |
      synth: waist_roll ramp 0->+4deg->0 (lean LEFT). Apex CG shift
      ~4 cm laterally at hip height; well within the support polygon.
    ops:
      - synthesize_waist_ramp:
          axis: roll
          peak_deg: 4.0
          ramp_in_frames: 30
          hold_frames: 20
          ramp_out_frames: 30
      - freeze:
          groups: [arms, head]

  - bin_name: lean_left_medium
    family: static_upper_body
    notes: |
      synth: waist_roll ramp 0->+7deg->0. Apex CG shift ~7 cm
      laterally at hip height; mid-range lateral reach.
    ops:
      - synthesize_waist_ramp:
          axis: roll
          peak_deg: 7.0
          ramp_in_frames: 30
          hold_frames: 20
          ramp_out_frames: 30
      - freeze:
          groups: [arms, head]

  - bin_name: lean_left_large
    family: static_upper_body
    notes: |
      synth: waist_roll ramp 0->+10deg->0 (AT CAP). Apex CG shift
      ~10 cm laterally at hip height -- right at the foot half-WIDTH.
      Beyond this the contralateral foot will lift; use a side_step
      primitive instead for further lateral motion.
    ops:
      - synthesize_waist_ramp:
          axis: roll
          peak_deg: 10.0
          ramp_in_frames: 30
          hold_frames: 20
          ramp_out_frames: 30
      - freeze:
          groups: [arms, head]

