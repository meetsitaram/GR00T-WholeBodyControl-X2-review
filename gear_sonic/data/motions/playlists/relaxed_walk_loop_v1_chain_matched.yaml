name: x2_ultra_relaxed_walk_loop_v1_chain_matched
output_key: relaxed_walk__v1_chain_matched__home_loop
fps: 30

# A/B counterpart of relaxed_walk_loop_v1.yaml that swaps the source
# retarget bundle from uniform_h14 (whole-body scaler @ h=1.4) to
# the committed chain_matched config (per-chain SOMA scaler with
# per-segment leg ratios + chain-matched IK weights / wrist smoothing).
# Built from soma_to_x2_ultra_chain_matched_retargeter_config.json
# via scripts/retarget_one.py.
#
# All segment names, trim windows (start_frame, n_frames), and speed
# multipliers are identical to relaxed_walk_loop_v1.yaml -- the only
# delta is the `source:` filename. This is deliberate so the visual
# diff between the two stitched outputs is purely the retargeter
# change.
#
# Trade-offs vs uniform_h14 -- see FK report at the bottom of
# play_pkl_motions_commands.md for the post-rebuild numbers (walk
# distance, foot slide, loop closure). If you need to retune trim
# (start_frame, n_frames) separately for chain_matched, run the FK
# inter-step sweep helper used for the uniform_h14 trim.
#
# Choreography (same shape as v1):
#
#   1. Pivot LEFT 90 deg.        4.90 s
#   2. Relaxed-walk forward.     6.27 s, ~2.89 m, ends inter-step
#   3. Stop.                     2.50 s (rest seam)
#   4. Pivot RIGHT 90 deg.       5.17 s
#   5. Pivot RIGHT 90 deg.       5.17 s
#   6. Relaxed-walk forward.     6.27 s, ~2.89 m, back over home
#   7. Stop.                     2.50 s (rest seam)
#   8. Pivot LEFT 90 deg.        4.90 s

zero_xy: true
zero_yaw: true

rest:
  # Track-matched rest pose so segment_start <-> rest pose distance is small.
  source: gear_sonic/data/motions/x2_ultra_stitched_idle_relaxed_arms_chain_matched.pkl
  motion_key: null
  frame: 0
  rest_frames: 75                # 2.5 s seam
  blend_in_frames: 30
  blend_out_frames: 30

segments:
  - name: anchor_open
    source: gear_sonic/data/motions/x2_ultra_retarget_chain_matched.pkl
    motion_key: neutral_idle_loop_002__A074__speed_1.0
    start_frame: 0
    n_frames: 30                 # 1.00 s

  - name: pivot_left_1
    source: gear_sonic/data/motions/x2_ultra_retarget_chain_matched.pkl
    motion_key: idle_turn_270_003__A149_M__speed_1.0
    start_frame: 0
    n_frames: 147                # 4.90 s, +90 deg

  - name: relaxed_walk_out
    source: gear_sonic/data/motions/x2_ultra_retarget_chain_matched.pkl
    motion_key: Relaxed_walk_forward_001__A057__speed_1.0
    start_frame: 0
    n_frames: 188                # 6.27 s, ~2.89 m forward (chain_matched scaling)

  - name: pivot_right_1
    source: gear_sonic/data/motions/x2_ultra_retarget_chain_matched.pkl
    motion_key: step_rotate_idle_090_002__A026_M__speed_1.0
    start_frame: 0
    n_frames: 155                # 5.17 s, -90 deg

  - name: pivot_right_2
    source: gear_sonic/data/motions/x2_ultra_retarget_chain_matched.pkl
    motion_key: step_rotate_idle_090_002__A026_M__speed_1.0
    start_frame: 0
    n_frames: 155                # 5.17 s, -90 deg (cumulative -180 from prev)

  - name: relaxed_walk_back
    source: gear_sonic/data/motions/x2_ultra_retarget_chain_matched.pkl
    motion_key: Relaxed_walk_forward_001__A057__speed_1.0
    start_frame: 0
    n_frames: 188                # 6.27 s, ~2.89 m forward (returns toward home)

  - name: pivot_left_2
    source: gear_sonic/data/motions/x2_ultra_retarget_chain_matched.pkl
    motion_key: idle_turn_270_003__A149_M__speed_1.0
    start_frame: 0
    n_frames: 147                # 4.90 s, +90 deg (back to original heading)

  - name: anchor_close
    source: gear_sonic/data/motions/x2_ultra_retarget_chain_matched.pkl
    motion_key: neutral_idle_loop_002__A074__speed_1.0
    start_frame: 0
    n_frames: 30                 # 1.00 s
