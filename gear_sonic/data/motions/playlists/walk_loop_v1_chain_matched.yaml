name: x2_ultra_walk_loop_v1_chain_matched
output_key: walk__v1_chain_matched__home_loop
fps: 30

# A/B counterpart of walk_loop_v1_uniform_h14.yaml that swaps the source
# retarget bundle from uniform_h14 to the committed chain_matched track
# (per-chain SOMA scaler with per-segment leg ratios + chain-matched IK
# weights / wrist smoothing). All segment names, trim windows, and speed
# multipliers are identical -- only the source PKL filename differs.
#
# See walk_loop_v1_uniform_h14.yaml for the full choreography description
# and walk_forward_loop_001__A021 trim rationale.

zero_xy: true
zero_yaw: true

rest:
  # Rest pose retargeted with the SAME chain_matched config as the segments
  # below -- previously this pointed at x2_ultra_stitched_idle_relaxed_arms.pkl
  # whose joints were from an older config (knees ~+5 deg vs chain_matched's
  # +21 deg, wrists rotated ~80 deg). Using the matched rest pose shrinks
  # segment_start <-> rest L2 pose distance from ~1.6-2.2 rad down to
  # ~0.5-1.0 rad, eliminating the visible "snap to default pose and back"
  # between motion clips.
  source: gear_sonic/data/motions/x2_ultra_stitched_idle_relaxed_arms_chain_matched.pkl
  motion_key: null
  frame: 0
  rest_frames: 75                # 2.5 s seam
  blend_in_frames: 30
  blend_out_frames: 30

segments:
  - name: anchor_open
    source: gear_sonic/data/motions/x2_ultra_retarget_chain_matched.pkl
    motion_key: neutral_idle_loop_002__A074__speed_1.0
    start_frame: 0
    n_frames: 30                 # 1.00 s

  - name: pivot_left_1
    source: gear_sonic/data/motions/x2_ultra_retarget_chain_matched.pkl
    motion_key: idle_turn_270_003__A149_M__speed_1.0
    start_frame: 0
    n_frames: 147                # 4.90 s, +90 deg

  - name: walk_out
    source: gear_sonic/data/motions/x2_ultra_retarget_chain_matched.pkl
    motion_key: walk_forward_loop_001__A021__speed_1.0
    start_frame: 0
    n_frames: 158                # 5.27 s, ~3.5 m forward

  - name: pivot_right_1
    source: gear_sonic/data/motions/x2_ultra_retarget_chain_matched.pkl
    motion_key: step_rotate_idle_090_002__A026_M__speed_1.0
    start_frame: 0
    n_frames: 155                # 5.17 s, -90 deg

  - name: pivot_right_2
    source: gear_sonic/data/motions/x2_ultra_retarget_chain_matched.pkl
    motion_key: step_rotate_idle_090_002__A026_M__speed_1.0
    start_frame: 0
    n_frames: 155                # 5.17 s, -90 deg (cumulative -180 from prev)

  - name: walk_back
    source: gear_sonic/data/motions/x2_ultra_retarget_chain_matched.pkl
    motion_key: walk_forward_loop_001__A021__speed_1.0
    start_frame: 0
    n_frames: 158                # 5.27 s, ~3.5 m forward

  - name: pivot_left_2
    source: gear_sonic/data/motions/x2_ultra_retarget_chain_matched.pkl
    motion_key: idle_turn_270_003__A149_M__speed_1.0
    start_frame: 0
    n_frames: 147                # 4.90 s, +90 deg (back to original heading)

  - name: anchor_close
    source: gear_sonic/data/motions/x2_ultra_retarget_chain_matched.pkl
    motion_key: neutral_idle_loop_002__A074__speed_1.0
    start_frame: 0
    n_frames: 30                 # 1.00 s
