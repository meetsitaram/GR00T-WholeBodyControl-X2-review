name: x2_ultra_one_foot_v1
output_key: one_foot__v1__balance_test
fps: 30

# Sim-only experiment: can iter-22k hold a one-foot stand?
#
# Source clip is loco__idle_one_foot_left__001__A024 from
# x2_ultra_bones_seed.pkl. Naming convention: "one_foot_left" = balancing
# on the left foot, with the right leg lifted (in this clip the right
# knee folds up to ~117 deg at the peak).
#
# The full 22 s recording has 5 distinct lift windows of varying
# intensity. For the first sim test we keep the full clip so the policy
# sees the same gentle->steep progression the actor performed:
#
#   * frame 132 (4.4 s):  R_knee +30 deg (mild dip)
#   * frame 264 (8.8 s):  R_knee +25 deg (mild)
#   * frame 363 (12.1 s): R_knee +41 deg (medium)
#   * frame 429 (14.3 s): R_knee +58 deg (committed)
#   * frame 594 (19.8 s): R_knee +73 deg (high)
#   * frame 627 (20.9 s): R_knee +58 deg (returning)
#
# Bracketed by 1.0 s idle anchors and a 0.66 s rest seam. Total reel
# ~25 s.

zero_xy: true
zero_yaw: true

rest:
  source: gear_sonic/data/motions/x2_ultra_stitched_idle_relaxed_arms.pkl
  motion_key: null
  frame: 0
  rest_frames: 20
  blend_in_frames: 6
  blend_out_frames: 6

segments:
  - name: anchor_open
    source: gear_sonic/data/motions/x2_ultra_bones_seed.pkl
    motion_key: loco__neutral_idle_loop_002__A074
    start_frame: 0
    n_frames: 30                 # 1.00 s

  - name: stand_one_foot
    source: gear_sonic/data/motions/x2_ultra_bones_seed.pkl
    motion_key: loco__idle_one_foot_left__001__A024
    start_frame: 0
    n_frames: 664                # 22.13 s, full clip

  - name: anchor_close
    source: gear_sonic/data/motions/x2_ultra_bones_seed.pkl
    motion_key: loco__neutral_idle_loop_002__A074
    start_frame: 0
    n_frames: 30                 # 1.00 s
