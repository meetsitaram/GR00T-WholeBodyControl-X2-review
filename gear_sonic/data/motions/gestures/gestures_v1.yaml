# Live-trigger gesture catalog for the Quest3 planner stack.
# Loaded once at recorder startup; `play_gesture <name>` resolves
# names against this file. Per-entry schema mirrors the offline
# stitching playlists at gear_sonic/data/motions/playlists/.
#
# All entries are gestures recorded live from the real X2 robot
# (self-generated motions). Add a new gesture by appending a row,
# restart the recorder. `source` paths resolve relative to repo root.
name: x2_ultra_gestures_v1
gestures:
  - name: wave_high
    source: gear_sonic/data/motions/x2_recorded_gestures/left_wave_high_001.pkl
    motion_key: null
    start_frame: 0
    n_frames: null

