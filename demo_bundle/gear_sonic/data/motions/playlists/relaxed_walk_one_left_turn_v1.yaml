name: x2_ultra_relaxed_walk_one_left_turn_v1
output_key: relaxed_walk__v1__one_left_turn
fps: 30

# Single-left-turn subset of `relaxed_walk_loop_v1.yaml` (2026-06-26).
# Mirrors `relaxed_walk_two_right_turns_v1.yaml` but with a single
# `pivot_left` instead of two `pivot_right`s, wrapped in the same
# neutral_idle anchors and 2.5 s rest seams the parent uses.
#
# Reel:
#   1. neutral_idle anchor                  (1.00 s)
#   2. idle_turn_270_003__A149_M            (4.90 s, +90 deg left)
#   3. neutral_idle anchor                  (1.00 s)
#
# Plus two 2.5 s rest seams between segments -> 11.90 s total
# (357 frames @ 30 fps). End yaw: +90 deg (quarter-turn left).
#
# XY drift: the left pivot drifts ~0.30 m laterally during rotation per
# the parent's notes; with no compensating second pivot the net XY
# closure carries that drift through. Confirm exact numbers from the
# make_warehouse_motion build log.
#
# Track: uniform_h14 (matches the parent). For a chain_matched variant,
# copy this YAML and swap `x2_ultra_retarget_uniform_h14.pkl` ->
# `x2_ultra_retarget_chain_matched.pkl` and the rest source to
# `x2_ultra_stitched_idle_relaxed_arms_chain_matched.pkl`.

zero_xy: true
zero_yaw: true

rest:
  # Track-matched rest pose (2026-06-24) so segment_start <-> rest pose
  # distance is small; kills the visible "snap to default pose" between
  # segments.
  source: gear_sonic/data/motions/x2_ultra_stitched_idle_relaxed_arms_uniform_h14.pkl
  motion_key: null
  frame: 0
  rest_frames: 75                # 2.5 s seam
  blend_in_frames: 30
  blend_out_frames: 30

segments:
  - name: anchor_open
    source: gear_sonic/data/motions/x2_ultra_retarget_uniform_h14.pkl
    motion_key: neutral_idle_loop_002__A074__speed_1.0
    start_frame: 0
    n_frames: 30                 # 1.00 s

  - name: pivot_left_1
    source: gear_sonic/data/motions/x2_ultra_retarget_uniform_h14.pkl
    motion_key: idle_turn_270_003__A149_M__speed_1.0
    start_frame: 0
    n_frames: 147                # 4.90 s, +90 deg

  - name: anchor_close
    source: gear_sonic/data/motions/x2_ultra_retarget_uniform_h14.pkl
    motion_key: neutral_idle_loop_002__A074__speed_1.0
    start_frame: 0
    n_frames: 30                 # 1.00 s
